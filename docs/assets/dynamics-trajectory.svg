  .axis { stroke: var(--line); stroke-width: 1; }
  .label { fill: var(--muted); font: 12px system-ui, sans-serif; }
  .title { fill: var(--ink); font: 600 13px system-ui, sans-serif; }
  .ref { fill: none; stroke: var(--ref); stroke-width: 2.4; }
  .cand { fill: none; stroke: var(--cand); stroke-width: 2.4; stroke-dasharray: 7 5; }
  .asked { stroke: var(--ok); stroke-width: 1.2; stroke-dasharray: 3 3; }
  .hit { fill: var(--ok); }
  .miss { fill: var(--cand); }
  .grid { fill: var(--muted); }
  .key-ref { fill: var(--ref); font: 12px system-ui, sans-serif; }
  .key-cand { fill: var(--cand); font: 12px system-ui, sans-serif; }
  .key-ok { fill: var(--ok); font: 12px system-ui, sans-serif; }
</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" role="img" aria-labelledby="title desc">
<title id="title">The right number at the asked time is not the right model</title>
<desc id="desc">Salt in a mixing tank over 30 minutes. The reference rises from 2 kg toward 40 kg and passes
26.021 kg at 20 minutes. A candidate that holds 26.021 kg from the start agrees at 20 minutes and nowhere
else. The structural layer compares both on 61 points across the range plus the asked time and refutes it at
the first point, t = 0, where they differ by 24.021 kg.</desc>
